<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0b">
  <title>Reporte de Roturas | MyL</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
</head>

<body>
  <div class="container">
    <header>
      <div class="header-row">
        <h1>Reporte Roturas</h1>
        <button id="settingsBtn" class="icon-btn" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </header>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <h2>Ajustes de Envío</h2>
        <div class="form-group">
          <label for="phoneInput">Teléfono Destino</label>
          <input type="tel" id="phoneInput" placeholder="Ej: 34600123456">
          <label style="margin-top: 8px; font-size: 0.75rem;">Formato internacional sin el símbolo +</label>
        </div>
        <div class="action-area">
          <button id="saveSettingsBtn" class="btn primary">Guardar Cambios</button>
          <button id="closeSettingsBtn" class="btn secondary" style="margin-top: 12px;">Cerrar</button>
        </div>
      </div>
    </div>

    <main>
      <!-- Order Section -->
      <section class="card">
        <div class="form-group">
          <label for="orderNumber">Pedido / Factura</label>
          <input type="text" id="orderNumber" placeholder="Número de documento..." inputmode="numeric">
        </div>
      </section>

      <!-- Client Section -->
      <section class="card">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="clientSearch">Cliente</label>
          <div style="position: relative;">
            <input type="text" id="clientSearch" placeholder="Buscar por nombre o código..." autocomplete="off">
            <div id="clientSuggestions" class="suggestions-list hidden"></div>
          </div>
        </div>
        <div id="selectedClientDisplay" class="selected-client hidden">
          <span id="selectedClientName"></span>
          <button id="clearClientBtn" class="delete-btn" style="color: var(--primary); opacity: 1;">&times;</button>
        </div>
      </section>

      <!-- Items Section -->
      <section class="card">
        <h2>Detalles de Rotura</h2>
        <div class="item-input-row">
          <div class="form-group" style="margin-bottom: 0;">
            <label for="itemCode">Referencia</label>
            <input type="text" id="itemCode" placeholder="Cód. Artículo" inputmode="numeric">
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label for="itemQty">Unidades</label>
            <input type="number" id="itemQty" placeholder="1" value="" min="1" inputmode="numeric">
          </div>
        </div>
        
        <div class="form-group">
          <label for="itemComment">Observaciones</label>
          <input type="text" id="itemComment" placeholder="Añadir comentario...">
        </div>

        <button id="addItemBtn" class="btn secondary">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Añadir a la lista
        </button>

        <div id="itemsList" class="items-list">
          <!-- Items dynamically added -->
        </div>
      </section>

      <!-- Action Section -->
      <div class="action-area" style="margin-top: 40px;">
        <button id="sendBtn" class="btn primary">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.592 2.654-.696c1.029.575 1.943.84 3.071.841 3.18 0 5.767-2.587 5.767-5.766.001-3.182-2.585-5.769-5.766-5.769zm9.318 9.319c1.697-3.181 1.084-7.202-1.747-9.721-2.903-2.585-7.377-2.576-10.264.02-2.738 2.463-3.415 6.471-1.746 9.682l-2.091 7.636 7.822-2.051c1.293.425 2.593.593 3.846.593 3.197 0 6.182-1.282 8.356-3.486 1.487-1.508 2.306-3.488 2.306-5.619 0-1.896-.645-3.692-1.803-5.263l-.679 8.216z" />
          </svg>
          Enviar Reporte por WhatsApp
        </button>
        <div style="text-align: center; margin-top: 16px; font-size: 0.8rem; color: var(--text-dim);">
          Enviando a: <span id="currentPhoneDisplay" style="color: var(--text-muted); font-weight: 500;">...</span>
          <button id="changePhoneBtn" style="background:none; border:none; color: var(--primary); text-decoration: none; cursor: pointer; margin-left: 6px; font-weight: 500;">(Cambiar)</button>
        </div>
      </div>
    </main>
  </div>
  <script src="clients.js"></script>
  <script src="app.js"></script>
  <script>
    // Limpieza de Service Workers antiguos para forzar la actualización
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
</body>

</html>
